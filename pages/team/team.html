<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">

    <title>SPRINT CAMP</title>
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/buttons.css" />
    <link rel="stylesheet" href="../../css/chips.css" />
    <link rel="stylesheet" href="../../css/header.css" />
    <link rel="stylesheet" href="../../css/footer.css" />
    <link rel="stylesheet" href="./team.css" />
</head>

<body>

    <main class="team-page">
        <section class="team-intro">

            <div class="team-thumbnail">
                <img id="team-thumbnail" src="" alt="프로젝트 썸네일" />
            </div>

            <div class="team-info">
                <div id="team-chips" class="team-chips"></div>

                <h1 id="team-title"></h1>

                <p id="team-name" class="team-badge"></p>

                <div class="members">
                    <div class="member-row">
                        <span class="member-label">팀장</span>
                        <span id="team-leader"></span>
                    </div>
                    <div class="member-row">
                        <span class="member-label">팀원</span>
                        <span id="team-members"></span>
                    </div>
                </div>

                <p id="team-description" class="team-description"></p>

                <div id="team-buttons" class="team-buttons"></div>

            </div>
        </section>

        <section class="project-images">

            <div class="main-project-image">
                <img id="main-ppt-image" src="" alt="프로젝트 이미지" />
            </div>

            <div class="ppt-slider">
                <div id="ppt-thumbnails" class="ppt-thumbnails"></div>
            </div>

        </section>

    </main>


    <script type="module" src="./team.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
