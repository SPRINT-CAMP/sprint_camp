<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPRINT CAMP 온라인 전시회</title>
    <!--css-->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <!--헤더-->
    <script type="module">
    import { renderHeader } from '../js/header.js';

    renderHeader([
    {
    content: '[전시회]',
    targetSection: 'hero-section' // 최상단 메인 배너로 이동
    },
    {
    content: '[개요]',
    targetSection: 'about-section' // SPRINT CAMP란? 섹션으로 이동
    },
    {
    content: '[일정]',
    targetSection: 'schedule-section' // 일정 섹션으로 이동
    },
    {
    content: '[분야]',
    targetSection: 'categories-section' // 분야 섹션으로 이동
    },
    {
    content: '[트랙]',
    targetSection: 'tracks-section' // 트랙 섹션으로 이동
    },
    {
      content: '☰',
      onClick: () => {
        // 햄버거버튼
      }
    }
    ]);
  </script>

    <main>
        <!--메인 배너-->
        <section id="hero-section">
            <!--이미지 영역-->
            <div class="hero-image">
                <img src="../assets/images/Logo.png" alt="SPRINT CAMP 로고">
            </div>

            <!--텍스트 영역-->
            <div class="hero-text">
                <h2>SPRINT CAMP<br>온라인 전시회</h2>
                <p class="hero-date">2026.09.00 - 2026.09.00</p>
                <div id="button-container"></div>

                <script type="module">import { createButton } from '../js/buttons.js';

                    const container = document.getElementById('button-container');

                    const resBtn = createButton('결과물 보러가기 →', {
                    size: 'long',
                    onClick: function() {
                        location.href = 'team.html';
                    }
                    });

                    container.append(resBtn);
                </script>
            </div>
        </section>

        <!--개요-->
        <section id="about-section">
        </section>

        <!--일정-->
        <section id="schedule-section">
        </section>

        <!--분야-->
        <section id="categories-section">
        </section>

        <!--트랙-->
        <section id="tracks-section">
        </section>
    </main>

    <!--푸터-->
    <script type="module">
    import { renderFooter } from '../js/footer.js';
    renderFooter();
</script>
</body>
</html>
